name: Publish tutorial slides

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - ".agents/skills/build-tutorial-slides/**"
      - "bin/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - ".agents/skills/build-tutorial-slides/**"
      - "bin/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Check tutorial
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test tutorial checks
        run: python3 -m unittest discover -s tests
      - name: Validate run terminology and iteration links
        run: python3 bin/check-runs
      - name: Validate feature step vocabulary
        run: python3 bin/step-drift
      - name: Validate slides
        run: python3 .agents/skills/build-tutorial-slides/scripts/validate_deck.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
